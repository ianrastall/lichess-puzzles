name: Build

on:
  push:
    branches: ['**']
    # A version tag such as 2.0.0 also publishes a GitHub release with the installer.
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build native core and run self-checks
        shell: pwsh
        run: ./build-core.ps1 -Configuration Release -Test

      - name: Install Inno Setup if missing
        shell: pwsh
        run: |
          $found = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ }
          if (-not $found) { choco install innosetup --yes --no-progress }

      - name: Publish app and build installer
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') { ./build-installer.ps1 -Version $env:GITHUB_REF_NAME }
          else { ./build-installer.ps1 }

      - name: Upload installer
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: lichess-puzzle-desktop-setup
          path: artifacts/installer/*.exe
          if-no-files-found: error

  release:
    if: ${{ github.ref_type == 'tag' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installer
        uses: actions/download-artifact@v8
        with:
          name: lichess-puzzle-desktop-setup
          path: installer

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" installer/*.exe
          --repo "$GITHUB_REPOSITORY"
          --title "Lichess Puzzle Desktop $GITHUB_REF_NAME"
          --generate-notes
