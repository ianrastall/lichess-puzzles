[workspace]
resolver = "3"
members = ["core/domain", "core/ffi", "cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"

[workspace.dependencies]
lichess_puzzles_core = { path = "core/domain" }
clap = { version = "4.6.7", features = ["derive"] }
cozy-chess = "0.3.4"
csv = "1.4.0"
memmap2 = "0.9.12"
prost = "0.14.4"
prost-build = "0.14.4"
protox = "0.10.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
ureq = "3.5.0"
zstd = "0.14.3"

[profile.release]
panic = "unwind"
