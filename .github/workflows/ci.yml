name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build native core and run self-checks
        shell: pwsh
        run: ./build-core.ps1 -Configuration Release -Test

      - name: Build app (Release, x64)
        run: dotnet build LichessPuzzleDesktop.slnx -c Release

      - name: Upload artifact (win-x64)
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: lichess-puzzle-desktop-win-x64
          path: app/LichessPuzzleDesktop/bin/Release/net10.0-windows10.0.19041.0/win-x64/
